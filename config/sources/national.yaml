# National constraint + incentive layers (all public, no key required).
# Each entry: url (ArcGIS layer), plus the fields the pipeline relies on.
# Checked live 2026-11-06; see README "Data sources" for status notes.

wetlands_nwi:
  url: https://fwspublicservices.wim.usgs.gov/wetlandsmapservice/rest/services/Wetlands/MapServer/0
  fields: [WETLAND_TYPE, ATTRIBUTE]
  note: USFWS National Wetlands Inventory. State wetland layers (e.g. MassDEP) are added per state.

flood_nfhl:
  url: https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer/28
  fields: [FLD_ZONE, ZONE_SUBTY, SFHA_TF]
  # Special Flood Hazard Area zones treated as exclusions; 0.2% annual chance (X shaded) is a flag only.
  exclude_zones: [A, AE, AH, AO, AR, A99, V, VE]

dem_3dep:
  url: https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer
  resolution_m: 10

landcover_nlcd:
  wcs: https://www.mrlc.gov/geoserver/mrlc_download/wcs
  coverage: mrlc_download__NLCD_2021_Land_Cover_L48
  resolution_m: 30
  forest_classes: [41, 42, 43]          # deciduous, evergreen, mixed
  wetland_classes: [90, 95]
  barren_classes: [31]                  # barren land: proxy for pits/quarries
  developed_classes: [21, 22, 23, 24]

energy_community_msa:
  url: https://arcgis.netl.doe.gov/server/rest/services/Hosted/2024_MSAs_NonMSAs_that_are_Energy_Communities/FeatureServer/0
  note: DOE/NETL 2024 statistical-area energy communities (IRA 45/48 bonus). Verify current-year list before relying on it.

energy_community_coal:
  url: https://arcgis.netl.doe.gov/server/rest/services/Hosted/2024_Coal_Closure_Energy_Communities/FeatureServer/0
